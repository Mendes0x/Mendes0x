<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#12343B"/>
      <stop offset="1" stop-color="#3A3115"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#F5E6C8"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="260" rx="18"/></clipPath>
    <clipPath id="typed">
      <rect x="376" y="196" height="30" width="0">
        <animate attributeName="width" values="0;262;262" keyTimes="0;0.45;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- símbolos de código flutuando -->
    <g font-family="'Fira Code','Courier New',monospace" fill="#5BA7A7">
      <text x="70" y="70" font-size="26" opacity="0.35">{ }
        <animate attributeName="y" values="70;50;70" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.5;0.15" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="190" y="215" font-size="22" opacity="0.3">&lt;/&gt;
        <animate attributeName="y" values="215;195;215" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.45;0.15" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="300" y="60" font-size="20" fill="#F2C94C" opacity="0.3">$
        <animate attributeName="y" values="60;42;60" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.45;0.1" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="720" y="55" font-size="24" opacity="0.3">01
        <animate attributeName="y" values="55;38;55" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.45;0.1" dur="6.5s" repeatCount="indefinite"/>
      </text>
      <text x="840" y="210" font-size="26" fill="#F2C94C" opacity="0.3">#!
        <animate attributeName="y" values="210;190;210" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.5;0.15" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="915" y="110" font-size="22" opacity="0.3">=&gt;
        <animate attributeName="y" values="110;92;110" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.45;0.1" dur="5.5s" repeatCount="indefinite"/>
      </text>
      <text x="40" y="170" font-size="20" fill="#F2C94C" opacity="0.3">;
        <animate attributeName="y" values="170;152;170" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- brilho passando -->
    <rect x="-200" y="-20" width="110" height="300" fill="#FFFFFF" opacity="0.05" transform="skewX(-20)">
      <animate attributeName="x" from="-200" to="1200" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- título -->
    <text x="500" y="122" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="74" font-weight="700" fill="url(#gold)">Mendes0x</text>
    <text x="500" y="162" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="19" letter-spacing="4" fill="#F5E6C8" opacity="0.9">BOTS · TOOLS · AUTOMATION · LINUX</text>

    <!-- linha que desenha -->
    <line x1="380" y1="180" x2="620" y2="180" stroke="#F2C94C" stroke-width="2" stroke-linecap="round" stroke-dasharray="240" stroke-dashoffset="240">
      <animate attributeName="stroke-dashoffset" values="240;0;0;240" keyTimes="0;0.3;0.8;1" dur="7s" repeatCount="indefinite"/>
    </line>

    <!-- terminal digitando -->
    <g clip-path="url(#typed)">
      <text x="376" y="218" font-family="'Fira Code','Courier New',monospace" font-size="18" fill="#5BA7A7">$ ./make_life_easier.sh</text>
    </g>
    <rect y="201" width="9" height="20" fill="#F2C94C">
      <animate attributeName="x" values="376;638;638" keyTimes="0;0.45;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="998" height="258" rx="18" fill="none" stroke="#5BA7A7" stroke-opacity="0.45" stroke-width="2"/>
</svg>
